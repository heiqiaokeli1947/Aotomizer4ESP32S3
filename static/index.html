<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>喷雾控制器</title>
    <link rel="stylesheet" href="/static/spectre.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .grid-hero {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .bg-grey {
            background-color: #efefef;
            padding: 1rem;
        }

        header>h3 {
            margin: 0;
            padding: 4rem;
        }

        .hidden {
            display: none;
        }

        /* Tabs styles */
        .tabs {
            margin-bottom: 1rem;
        }

        .tabs .tab-nav {
            position: relative;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .tabs .tab-radio {
            position: absolute;
            opacity: 0;
            z-index: -1;
        }

        .tabs .tab-link {
            position: relative;
            padding: .5rem 1rem;
            font-size: .875rem;
            font-weight: 500;
            line-height: 1.5;
            color: #666;
            background-color: transparent;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .15s ease-in-out, border-color .15s ease-in-out;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .tabs .tab-link:hover {
            color: #007bff;
        }

        .tabs .tab-radio:checked + .tab-link {
            color: #007bff;
            border-bottom-color: #007bff;
        }

        .tabs .tab-panels {
            position: relative;
            padding-top: 1rem;
        }

        .tabs .tab-panel {
            display: none;
        }

        /* 默认显示第一个标签页 */
        .tabs .tab-panels #tab-sensor-section {
            display: block;
        }

        /* Card 内部网格 - 使用自定义类名避免与 spectre.css 冲突 */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        /* Grid 子元素 - 避免使用 spectre.css 的 .column */
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .text-gray {
            color: #666;
        }

        .text-xs {
            font-size: 0.75rem;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-md {
            font-size: 1rem;
        }

        .text-lg {
            font-size: 1.25rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .font-semibold {
            font-weight: 600;
        }

        .mb-1 {
            margin-bottom: 0.25rem;
        }

        .mt-1 {
            margin-top: 0.25rem;
        }

        .mt-2 {
            margin-top: 0.5rem;
        }

        .text-purple {
            color: #9b59b6;
        }
    </style>
    <script src="/static/chart.umd.js"></script>
    <script src="/static/sweetalert.min.js"></script>
    <script src="/static/jquery.min.js"></script>
</head>

<body>
    <!-- 头部区域 -->
    <section class="section bg-primary">
        <section class="grid-hero container grid-480">
            <header class="text-center" style="padding: 1rem 0;">
                <h2 style="margin: 0;">Smart node</h2>
            </header>
        </section>
    </section>

    <!-- 设备控制区域 -->
    <section class="section">
        <section id="device-control" class="container grid-480">
            <!-- 设备名称 -->
            <div class="form-group">
                <label>设备名称:<span id="device_name_show">----</span></label>
            </div>

            <!-- WiFi名称 -->
            <div class="form-group">
                <label>WiFi名称:<span id="wifi_name_show">----</span></label>
            </div>

            <!-- 标签页容器 -->
            <div class="tabs">
                <!-- 标签导航栏 -->
                <div class="tab-nav">
                    <input id="tab-sensor" type="radio" name="tabs" class="tab-radio" checked>
                    <label class="tab-link" for="tab-sensor">传感器数据</label>
                    <input id="tab-setting" type="radio" name="tabs" class="tab-radio">
                    <label class="tab-link" for="tab-setting">参数设置</label>
                    <input id="tab-network" type="radio" name="tabs" class="tab-radio">
                    <label class="tab-link" for="tab-network">网络设置</label>
                </div>

                <!-- 内容区域 -->
                <div class="tab-panels">
                    <!-- 传感器数据面板 -->
                    <div id="tab-sensor-section" class="tab-panel">
                        <!-- 图表 -->
                        <canvas id="monitorChart" width="100%" height="100px"></canvas>

                        <!-- 传感器数据仪表板 -->
                        <div class="form-group" style="margin-top: 1rem;">
                            <label class="form-label" style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.75rem;">实时数据</label>
                        </div>

                        <!-- 卡片网格容器 -->
                        <div class="columns col-mx-auto" style="max-width: 100%;">
                            <!-- 喷雾状态卡片 -->
                            <div class="column col-6 col-sm-6 col-md-6 col-lg-3">
                                <div class="card">
                                    <div class="card-header bg-blue">
                                        <div class="card-title h5 text-white">喷雾状态</div>
                                    </div>
                                    <div class="card-body" style="padding: 0.75rem;">
                                        <div class="grid grid-3">
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">空调状态</div>
                                                <div class="text-sm font-semibold text-blue" id="id_airConditionerStatus">----</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">喷雾次数</div>
                                                <div class="text-sm font-semibold text-blue" id="id_totalSprayCount">----</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">补水次数</div>
                                                <div class="text-sm font-semibold text-blue" id="id_totalAddWaterCount">----</div>
                                            </div>
                                        </div>
                                        <div class="grid grid-3 mt-2">
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">水位状态</div>
                                                <div class="text-xs font-semibold text-gray" id="id_waterMark">----</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">喷雾阈值</div>
                                                <div class="text-xs font-semibold text-gray" id="id_fineTempThreshold">----℃</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">补水间隔</div>
                                                <div class="text-xs font-semibold text-gray" id="id_addWaterMinInterval">----s</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 环境参数卡片 -->
                            <div class="column col-6 col-sm-6 col-md-6 col-lg-3">
                                <div class="card">
                                    <div class="card-header bg-green">
                                        <div class="card-title h5 text-white">环境参数</div>
                                    </div>
                                    <div class="card-body" style="padding: 0.75rem;">
                                        <div class="grid grid-3">
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">温度</div>
                                                <div class="text-md font-bold" style="color: #e74c3c;" id="id_temp">----℃</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">湿度</div>
                                                <div class="text-md font-bold" style="color: #27ae60;" id="id_humity">----%</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">湿球温度</div>
                                                <div class="text-md font-bold" style="color: #3498db;" id="id_wetBulbTemp">----℃</div>
                                            </div>
                                        </div>
                                        <div class="grid grid-3 mt-2">
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">气压</div>
                                                <div class="text-sm font-semibold text-purple" id="id_presure">----Pa</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">照度</div>
                                                <div class="text-sm font-semibold text-purple" id="id_luminance">----Lux</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-xs mb-1">PM2.5</div>
                                                <div class="text-sm font-semibold text-purple" id="id_pm2_5">----μg/m³</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 运行时间卡片 -->
                            <div class="column col-12 col-sm-12 col-md-12 col-lg-6">
                                <div class="card">
                                    <div class="card-header">
                                        <div class="card-title h5">运行时间</div>
                                    </div>
                                    <div class="card-body" style="padding: 0.75rem;">
                                        <div class="grid grid-2">
                                            <div class="grid-item">
                                                <div class="text-gray text-sm mb-1">本次启动</div>
                                                <div class="text-lg font-bold text-primary" id="id_runtime">----s</div>
                                            </div>
                                            <div class="grid-item">
                                                <div class="text-gray text-sm mb-1">总运行时间</div>
                                                <div class="text-lg font-bold text-primary" id="id_totalRuntime">----s</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style="height: 20px;"></div>
                    </div> <!-- 关闭 tab-sensor-section -->

                    <!-- 参数设置面板 -->
                    <div id="tab-setting-section" class="tab-panel">
                        <!-- 温度阈值设置 -->
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600; font-size: 1.1rem;">温度阈值</label>
                            <label>温度高阈值 (℃):</label>
                            <div class="input-group">
                                <input type="text" id="threhold_h" class="form-input" value="----"
                                    placeholder="外机散热器翅片温度高阈值." />
                            </div>
                            <label>温度低阈值 (℃):</label>
                            <div class="input-group">
                                <input type="text" id="threhold_l" class="form-input" value="----"
                                    placeholder="外机散热器翅片温度低阈值：喷水启动阈值." />
                            </div>
                        </div>

                        <!-- 喷雾参数设置 -->
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600; font-size: 1.1rem;">喷雾参数</label>
                            <label>喷水周期 (s):</label>
                            <div class="input-group">
                                <input type="text" id="spray_period" class="form-input" value="----"
                                    placeholder="喷水控制周期时长." />
                            </div>
                            <label>喷水最短时长 (s):</label>
                            <div class="input-group">
                                <input type="text" id="min_spary_time" class="form-input" value="----"
                                    placeholder="外机温度比喷水阈值每高1℃则喷水时间多1s." />
                            </div>
                            <label>加水最小间隔 (s):</label>
                            <div class="input-group">
                                <input type="text" id="min_add_water_interval" class="form-input" value="----"
                                    placeholder="水箱加水最短时间间隔,防止用水过多." />
                            </div>
                        </div>

                        <!-- PWM参数设置 -->
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600; font-size: 1.1rem;">PWM参数</label>
                            <label>PWM频率 (Hz):</label>
                            <div class="input-group">
                                <input type="text" id="pwm_freq" class="form-input" value="----"
                                    placeholder="PWM频率 (Hz)." />
                            </div>
                            <label>最小PWM占空比 (%):</label>
                            <div class="input-group">
                                <input type="text" id="pwm_min_duty" class="form-input" value="----"
                                    placeholder="PWM最小占空比." />
                            </div>
                            <label>最大PWM占空比 (%):</label>
                            <div class="input-group">
                                <input type="text" id="pwm_max_duty" class="form-input" value="----"
                                    placeholder="PWM最大占空比." />
                            </div>
                        </div>

                        <!-- 开关控制 -->
                        <div class="form-group" style="display: flex; align-items: center;">
                            <label class="form-label" style="margin-right: 10px;">开关控制:</label>
                            <label class="form-switch" style="margin-right: 15px;">
                                <input type="checkbox" id="checkbox_1" />
                                <i class="form-icon"></i>
                                <span id="sw_1_name">---</span>
                            </label>
                            <label class="form-switch" style="margin-right: 20px;">
                                <input type="checkbox" id="checkbox_2" />
                                <i class="form-icon"></i>
                                <span id="sw_2_name">---</span>
                            </label>
                        </div>

                        <!-- 应用设置按钮 -->
                        <div class="form-group" style="text-align: right;">
                            <button type="button" id="btn_switch" class="btn btn-primary">Apply setting</button>
                        </div>

                        <!-- 重启/重置按钮 -->
                        <div class="form-group" style="overflow: hidden;">
                            <button type="button" id="btn_reset" class="btn btn-primary float-left">reset</button>
                            <button type="button" id="btn_restart" class="btn btn-primary float-right">restart</button>
                        </div>

                        <div style="height: 40px;"></div>
                    </div> <!-- 关闭 tab-setting-section -->

                    <!-- 网络设置面板 -->
                    <div id="tab-network-section" class="tab-panel">
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600; font-size: 1.1rem;">网络设置</label>
                        </div>
                        <form>
                            <div class="form-group">
                                <label>设备名称:</label>
                                <div class="input-group">
                                    <input type="text" id="device_name" class="form-input" value="----"
                                        placeholder="Input device name." />
                                </div>

                                <label>设备密码:</label>
                                <div class="input-group">
                                    <input type="text" id="devicepwd" class="form-input" value="pengping"
                                        placeholder="Input device password." />
                                </div>

                                <label>开关1名称:</label>
                                <div class="input-group">
                                    <input type="text" id="input_switch_1_name" class="form-input" value="----"
                                        placeholder="Input switch 1 name." />
                                </div>

                                <label>开关2名称:</label>
                                <div class="input-group">
                                    <input type="text" id="input_switch_2_name" class="form-input" value="----"
                                        placeholder="Input switch 2 name." />
                                </div>

                                <label>服务器IP:</label>
                                <div class="input-group">
                                    <input type="text" id="serverurl" class="form-input" value="192.168.1.124"
                                        placeholder="Input server IP." />
                                </div>

                                <label>WiFi名称:</label>
                                <div class="input-group">
                                    <input type="text" id="ssid" class="form-input" placeholder="Input or select WIFI SSID." />
                                    <button type="button" id="scanap" class="btn btn-primary float-right">Scan AP</button>
                                </div>

                                <label>WiFi密码:</label>
                                <div class="input-group">
                                    <input id="input-pwd" class="form-input" type="password" placeholder="Input WIFI password." />
                                    <button type="button" id="connect" class="btn btn-primary float-right">Connect</button>
                                </div>
                            </div>
                        </form>
                    </div> <!-- 关闭 tab-network-section -->
                </div> <!-- 关闭 tab-panels -->
            </div> <!-- 关闭 tabs 容器 -->
        </section>

        <!-- 底部 -->
        <section class="section bg-primary" style="margin-bottom: 0;">
            <section class="grid-hero container grid-480">
                <section class="text-center" style="padding: 1rem 0; margin: 0;">
                    <p style="margin: 0;">Powered by pengping.</p>
                </section>
            </section>
        </section>
    </section>

    <!-- 选择WiFi模态框 -->
    <div id="selectwifi" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">Near by WIFI:</div>
            </div>
            <div id="aplist" class="modal-body" style="background-color: #66b3ff; min-height: 50px"></div>
        </div>
    </div>

    <!-- AP列表项模板 -->
    <script id="item-ap" type="text/html">
        <div class="chip hand">
            <svg width="30px" height="20px" class="chip-icon">
                <path d="M15,20 L0.86,5.86 A20,20 0 0,1 29.14,5.86" fill="#d0d0d0" />
                <path d="M15,20 L{0},{1} A{2},{2} 0 0,1 {3},{1}" fill="#adadad" />
            </svg>
            <span class="chip-content">{4}</span>
        </div>
    </script>

    <!-- ============================================
         应用主脚本 - 模块化重构版本
         ============================================ -->
    <script>
        // ============================================
        // 配置常量模块 - 集中管理所有配置项
        // ============================================
        const CONFIG = {
            API: {
                STATUS: '../status',
                SCAN_AP: '../scanap',
                SET_WIFI: '../setwifi',
                RESET: '../reset',
                RESTART: '../restart'
            },
            TIME: {
                REFRESH_INTERVAL: 5000,
                REQUEST_TIMEOUT: 10000
            },
            BUFFER: {
                MAX_SIZE: 350,
                INVALID_VALUE: -9999
            },
            SELECTORS: {
                // 设备信息
                DEVICE_NAME: '#device_name_show',
                WIFI_NAME: '#wifi_name_show',
                DEVICE_NAME_INPUT: '#device_name',
                DEVICEPWD: '#devicepwd',
                SERVERURL: '#serverurl',
                SSID: '#ssid',
                INPUT_PWD: '#input-pwd',

                // 运行时间
                RUNTIME: '#id_runtime',
                TOTAL_RUNTIME: '#id_totalRuntime',

                // 喷雾状态
                AIR_CONDITIONER_STATUS: '#id_airConditionerStatus',
                TOTAL_SPRAY_COUNT: '#id_totalSprayCount',
                TOTAL_ADD_WATER_COUNT: '#id_totalAddWaterCount',
                WATER_MARK: '#id_waterMark',
                FINE_TEMP_THRESHOLD: '#id_fineTempThreshold',
                ADD_WATER_MIN_INTERVAL: '#id_addWaterMinInterval',

                // 环境参数
                TEMP: '#id_temp',
                WET_BULB_TEMP: '#id_wetBulbTemp',
                HUMI: '#id_humity',
                PRESURE: '#id_presure',
                LUMINANCE: '#id_luminance',
                PM25: '#id_pm2_5',

                // 开关控制
                SWITCH_1: '#checkbox_1',
                SWITCH_2: '#checkbox_2',
                SWITCH_1_NAME: '#sw_1_name',
                SWITCH_2_NAME: '#sw_2_name',
                SWITCH_1_NAME_INPUT: '#input_switch_1_name',
                SWITCH_2_NAME_INPUT: '#input_switch_2_name',

                // 参数设置
                THRESHOLD_H: '#threhold_h',
                THRESHOLD_L: '#threhold_l',
                SPRAY_PERIOD: '#spray_period',
                MIN_SPRAY_TIME: '#min_spary_time',
                MIN_ADD_WATER_INTERVAL: '#min_add_water_interval',
                PWM_FREQ: '#pwm_freq',
                PWM_MIN_DUTY: '#pwm_min_duty',
                PWM_MAX_DUTY: '#pwm_max_duty',

                // 按钮
                BTN_SWITCH: '#btn_switch',
                BTN_RESET: '#btn_reset',
                BTN_RESTART: '#btn_restart',
                BTN_CONNECT: '#connect',
                BTN_SCANAP: '#scanap',

                // 模态框
                SELECT_WIFI_MODAL: '#selectwifi',
                AP_LIST: '#aplist',

                // 标签页
                NETWORK_SECTION: '#tab-network-section'
            },
            UNITS: {
                temp: '℃',
                wetBulbTemp: '℃',
                humi: '%',
                presure: 'Pa',
                luminance: 'Lux',
                pm25: 'μg/m³',
                runtime: 's',
                threshold: '℃'
            },
            CHART_COLORS: {
                temp: 'rgb(75, 132, 192)',
                humi: 'rgb(175, 92, 192)',
                fanSpeed: 'rgb(175, 92, 92)',
                thresholdH: 'rgb(255, 0, 0)',
                thresholdL: 'rgb(0, 255, 0)'
            }
        };

        // ============================================
        // 工具函数模块
        // ============================================
        const UTILS = {
            /**
             * 检测用户是否正在编辑输入框
             * @returns {boolean}
             */
            isUserEditing: function() {
                const activeElement = document.activeElement;
                if (!activeElement) return false;
                const editableTags = ['INPUT', 'TEXTAREA', 'SELECT'];
                if (editableTags.includes(activeElement.tagName)) {
                    return !activeElement.readOnly && !activeElement.disabled;
                }
                return !!activeElement.isContentEditable;
            },

            /**
             * 格式化数值显示
             * @param {*} value - 原始值
             * @param {string} unit - 单位
             * @param {string} defaultValue - 默认显示值
             * @returns {string}
             */
            formatValue: function(value, unit = '', defaultValue = '----') {
                if (value === null || value === undefined || value === CONFIG.BUFFER.INVALID_VALUE) {
                    return defaultValue;
                }
                return `${value}${unit}`;
            },

            /**
             * 格式化时间显示
             * @param {number} seconds - 秒数
             * @returns {string}
             */
            formatTime: function(seconds) {
                if (seconds === null || seconds === undefined) return '----s';
                if (seconds < 60) return `${seconds}s`;
                if (seconds < 3600) return `${(seconds / 60).toFixed(1)}min`;
                return `${(seconds / 3600).toFixed(1)}h`;
            },

            /**
             * 安全解析JSON
             * @param {string} str - JSON字符串
             * @returns {object|null}
             */
            parseJSON: function(str) {
                try {
                    return JSON.parse(str);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    return null;
                }
            },

            /**
             * 显示消息提示
             * @param {string} title - 标题
             * @param {string} message - 消息内容
             * @param {string} type - 类型 (success/error/warning)
             */
            showMessage: function(title, message, type = 'success') {
                if (typeof swal === 'function') {
                    swal(title, message, type);
                } else {
                    alert(`${title}\n${message}`);
                }
            },

            /**
             * 字符串格式化 (类似Python的format)
             * @param {string} str - 模板字符串
             * @param {...*} args - 参数
             * @returns {string}
             */
            formatString: function(str, ...args) {
                return str.replace(/\{(\d+)\}/g, function(m, i) {
                    return args[parseInt(i)] || '';
                });
            }
        };

        // ============================================
        // 数据缓冲区 - 工厂模式
        // ============================================
        function createDataBuffer(maxSize = CONFIG.BUFFER.MAX_SIZE) {
            return {
                maxSize: maxSize,
                buffer: [],

                /**
                 * 检查缓冲区是否已满
                 * @returns {boolean}
                 */
                isFull: function() {
                    return this.buffer.length >= this.maxSize;
                },

                /**
                 * 添加数据到缓冲区
                 * @param {object} data - 数据对象
                 */
                add: function(data) {
                    if (this.isFull()) {
                        this.buffer.shift();
                    }
                    this.buffer.push(data);
                    console.log(`Buffer size: ${this.buffer.length}`);
                },

                /**
                 * 获取图表绘制数据
                 * @returns {object}
                 */
                getPlotData: function() {
                    const plotData = {
                        x: [],
                        temp: [],
                        humi: [],
                        pm25: [],
                        luminance: [],
                        presure: [],
                        fanSpeed: 0,
                        fineHThreshold: 0,
                        fineLThreshold: 0
                    };

                    // X轴标签
                    plotData.x = Array.from({ length: this.buffer.length }, (_, i) => i).reverse();

                    const invalidValue = CONFIG.BUFFER.INVALID_VALUE;
                    for (let i = 0; i < this.buffer.length; i++) {
                        const json = this.buffer[i];
                        plotData.temp[i] = json.temp === invalidValue ? undefined : json.temp;
                        plotData.humi[i] = json.humi === invalidValue ? undefined : json.humi;
                        plotData.pm25[i] = json.pm25 === invalidValue ? undefined : json.pm25;
                        plotData.luminance[i] = json.luminance === invalidValue ? undefined : json.luminance;
                        plotData.presure[i] = json.presure === invalidValue ? undefined : json.presure;
                    }

                    // 获取最新数据
                    if (this.buffer.length > 0) {
                        const last = this.buffer[this.buffer.length - 1];
                        plotData.fanSpeed = last.fanSpeed || 0;
                        plotData.fineHThreshold = last.fineHThreshold || 0;
                        plotData.fineLThreshold = last.fineTempThreshold || 0;
                    }

                    return plotData;
                }
            };
        }

        // ============================================
        // 设备数据模型 - 工厂模式
        // ============================================
        function createDeviceData() {
            return {
                data: {},
                INVALID_VALUE: CONFIG.BUFFER.INVALID_VALUE,

                /**
                 * 更新数据
                 * @param {object} rawData - 原始API响应数据
                 */
                update: function(rawData) {
                    this.data = this.parse(rawData);
                },

                /**
                 * 解析原始数据为结构化数据
                 * @param {object} rawData - 原始数据
                 * @returns {object}
                 */
                parse: function(rawData) {
                    const invalid = this.INVALID_VALUE;
                    return {
                        // 设备信息
                        deviceName: rawData.devicename || '---',
                        wifiName: rawData.wifiname || '---',
                        mode: rawData.mode || 'unknown',

                        // 运行时间
                        runTime: rawData.runTime || 0,
                        totalRunTime: rawData.totalRunTime || 0,

                        // 喷雾状态
                        spray: {
                            airConditionerStatus: rawData.airConditionerStatus || '---',
                            totalSprayCount: rawData.totalSprayCount || 0,
                            totalAddWaterCount: rawData.totalAddWaterCount || 0,
                            waterMark: rawData.waterMark || '---',
                            fineTempThreshold: rawData.fineTempThreshold || invalid,
                            addWaterMinInterval: rawData.minAddWaterInterval || 0
                        },

                        // 环境传感器
                        sensors: {
                            temp: rawData.temp || invalid,
                            wetBulbTemp: rawData.wetBulbTemp || invalid,
                            humi: rawData.humi || invalid,
                            presure: rawData.presure || invalid,
                            luminance: rawData.luminance || invalid,
                            pm25: rawData.pm25 || invalid
                        },

                        // 开关状态
                        switches: {
                            sw1: rawData.sw1 === true || rawData.sw1 === 'true',
                            sw2: rawData.sw2 === true || rawData.sw2 === 'true',
                            sw1Name: rawData.sw1name || 'S1',
                            sw2Name: rawData.sw2name || 'S2'
                        },

                        // 参数设置
                        settings: {
                            fineHThreshold: rawData.fineHThreshold || invalid,
                            fineLThreshold: rawData.fineLThreshold || invalid,
                            sprayPeriod: rawData.sprayPeriod || 0,
                            minSparyTime: rawData.minSparyTime || 0,
                            minAddWaterInterval: rawData.minAddWaterInterval || 0,
                            pwmFreq: rawData.pwmFreq || 0,
                            pwmMinDuty: rawData.pwmMinDuty || 0,
                            pwmMaxDuty: rawData.pwmMaxDuty || 0
                        },

                        // 网络配置
                        network: {
                            serverurl: rawData.serverurl || '',
                            deviceId: rawData.deviceId || ''
                        }
                    };
                },

                /**
                 * 便捷获取方法 - 支持点号路径
                 * @param {string} key - 键名（支持点号路径如 'sensors.temp'）
                 * @returns {*}
                 */
                get: function(key) {
                    const keys = key.split('.');
                    return keys.reduce((obj, k) => obj && obj[k], this.data);
                }
            };
        }

        function createChartManager(canvasId) {
            return {
                canvasId: canvasId,
                chart: null,
                bufferLength: CONFIG.BUFFER.MAX_SIZE,

                init: function() {
                    const ctx = document.getElementById(this.canvasId);
                    this.chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [
                                {
                                    label: '温度',
                                    data: [],
                                    fill: false,
                                    borderColor: CONFIG.CHART_COLORS.temp,
                                    tension: 0.1
                                },
                                {
                                    label: '湿度',
                                    data: [],
                                    fill: false,
                                    borderColor: CONFIG.CHART_COLORS.humi,
                                    tension: 0.1,
                                    hidden: true
                                },
                                {
                                    label: '风扇档位',
                                    data: [],
                                    fill: false,
                                    borderColor: CONFIG.CHART_COLORS.fanSpeed,
                                    tension: 0.1,
                                    hidden: true
                                },
                                {
                                    label: '高阈值',
                                    data: [],
                                    fill: false,
                                    borderColor: CONFIG.CHART_COLORS.thresholdH,
                                    tension: 0.1
                                },
                                {
                                    label: '低阈值',
                                    data: [],
                                    fill: false,
                                    borderColor: CONFIG.CHART_COLORS.thresholdL,
                                    tension: 0.1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            animation: true,
                            scales: {
                                y: {
                                    beginAtZero: false
                                }
                            }
                        }
                    });
                    return this;
                },

                updatePlotData: function(plotData) {
                    const data = this.chart.data;
                    data.datasets.forEach(function(dataset) {
                        if (dataset.data.length >= this.bufferLength) {
                            dataset.data.shift();
                        }
                        switch (dataset.label) {
                            case '温度':
                                dataset.data.push(plotData.temp.at(-1));
                                break;
                            case '湿度':
                                dataset.data.push(plotData.humi.at(-1));
                                break;
                            case '风扇档位':
                                dataset.data.push(plotData.fanSpeed);
                                break;
                            case '高阈值':
                                dataset.data.push(plotData.fineHThreshold);
                                break;
                            case '低阈值':
                                dataset.data.push(plotData.fineLThreshold);
                                break;
                        }
                    }.bind(this));
                    data.labels = plotData.x;
                    this.chart.update();
                }
            };
        }

        // ============================================
        // 刷新控制器 - 负责数据刷新定时与协调
        // ============================================
        function createRefreshController(deviceModel, views, dataBuffer, chart) {
            return {
                deviceModel: deviceModel,
                views: views,
                dataBuffer: dataBuffer,
                chart: chart,
                timer: null,
                isEditing: false,
                hasPendingRequest: false,

                start: function() {
                    const self = this;
                    // 立即刷新一次
                    this.refresh();
                    // 启动定时刷新
                    this.timer = setInterval(function() {
                        if (self.shouldRefresh()) {
                            self.refresh();
                        }
                    }, CONFIG.TIME.REFRESH_INTERVAL);
                },

                stop: function() {
                    if (this.timer) {
                        clearInterval(this.timer);
                        this.timer = null;
                    }
                },

                shouldRefresh: function() {
                    return !this.isEditing && !this.hasPendingRequest && !UTILS.isUserEditing();
                },

                refresh: function() {
                    const self = this;
                    const pwd = $(CONFIG.SELECTORS.DEVICEPWD).val();
                    console.log(`Refreshing with pwd: '${pwd}'`);

                    this.hasPendingRequest = true;

                    $.get(CONFIG.API.STATUS, { mode: 'get', devicepwd: pwd })
                        .done(function(response) {
                            const resJson = UTILS.parseJSON(response);
                            if (!resJson) {
                                console.error('Invalid response');
                                return;
                            }

                            if (resJson.errCode === '0') {
                                self.deviceModel.update(resJson);

                                self.views.forEach(function(view) {
                                    try {
                                        view.update(self.deviceModel);
                                    } catch (e) {
                                        console.error('View update error:', e);
                                    }
                                });

                                self.dataBuffer.add(resJson);
                                const plotData = self.dataBuffer.getPlotData();
                                self.chart.updatePlotData(plotData);
                            } else {
                                console.error('Refresh error:', resJson.msg);
                                self.handleErrorCode(resJson.errCode);
                            }
                        })
                        .fail(function(error) {
                            console.error('Refresh failed:', error);
                        })
                        .always(function() {
                            self.hasPendingRequest = false;
                        });
                },

                handleErrorCode: function(code) {
                    const selectors = [
                        CONFIG.SELECTORS.TEMP,
                        CONFIG.SELECTORS.HUMI,
                        CONFIG.SELECTORS.PRESURE,
                        CONFIG.SELECTORS.LUMINANCE,
                        CONFIG.SELECTORS.PM25
                    ];
                    const text = code === '-1' ? 'query failed' : 'unknown';
                    selectors.forEach(function(selector) {
                        $(selector).text(text);
                    });
                },

                pause: function() {
                    this.isEditing = true;
                },

                resume: function() {
                    this.isEditing = false;
                }
            };
        }

        // ============================================
        // 事件控制器 - 负责所有用户交互事件处理
        // ============================================
        function createEventController(refreshController) {
            return {
                refreshController: refreshController,

                bindEvents: function() {

                    });

                    $(CONFIG.SELECTORS.BTN_RESET).click(function() {

                    });

                    $(CONFIG.SELECTORS.BTN_CONNECT).click(function() {

                    });

                    $(CONFIG.SELECTORS.BTN_SCANAP).click(function() {

                    });

                    // WiFi列表项点击
                    $(CONFIG.SELECTORS.AP_LIST).on('click', '.chip', function() {

                        self.hideAPList();
                    });

                switchTab: function(tabId) {
                    $('.tabs .tab-panel').hide();
                    $('#tab-' + tabId + '-section').show();
                },

                showSensorSection: function() {
                    $('#tab-sensor').prop('checked', true);
                    this.switchTab('sensor');
                },

                showSettingSection: function() {
                    $('#tab-setting').prop('checked', true);
                    this.switchTab('setting');
                },

                hideAPList: function() {
                    $(CONFIG.SELECTORS.SELECT_WIFI_MODAL).removeClass('active');
                },

                showAPList: function(apList) {
                    const template = $('#item-ap').html();
                    let html = '';

                    for (const [ssid, rssi] of Object.entries(apList)) {
                        const strength = Math.min(Math.max((rssi + 100) / 60, 0), 1);
                        const arc1 = 5.86 + (15 - 5.86) * (1 - strength);
                        const radius = 20 * strength;
                        const arc2 = 29.14 - (29.14 - 15) * (1 - strength);
                        html += UTILS.formatString(template, arc1.toFixed(2), 5.86, radius.toFixed(2), arc2.toFixed(2), ssid);
                    }

                    $(CONFIG.SELECTORS.AP_LIST).html(html);
                    $(CONFIG.SELECTORS.SELECT_WIFI_MODAL).addClass('active');
                },

                handleSwitchSetting: function() {
                    const $btn = $(CONFIG.SELECTORS.BTN_SWITCH);
                    $btn.addClass('loading').prop('disabled', true);
                    this.refreshController.pause();

                    const url = UTILS.formatString(
                        '{0}?mode=set&devicepwd={1}&fineHThreshold={2}&fineLThreshold={3}&pwmFreq={4}&pwmMinDuty={5}&pwmMaxDuty={6}&sprayPeriod={7}&minSparyTime={8}&minAddWaterInterval={9}&sw1={10}&sw2={11}',
                        CONFIG.API.STATUS,
                        $(CONFIG.SELECTORS.DEVICEPWD).val(),
                        $(CONFIG.SELECTORS.THRESHOLD_H).val(),
                        $(CONFIG.SELECTORS.THRESHOLD_L).val(),
                        $(CONFIG.SELECTORS.PWM_FREQ).val(),
                        $(CONFIG.SELECTORS.PWM_MIN_DUTY).val(),
                        $(CONFIG.SELECTORS.PWM_MAX_DUTY).val(),
                        $(CONFIG.SELECTORS.SPRAY_PERIOD).val(),
                        $(CONFIG.SELECTORS.MIN_SPRAY_TIME).val(),
                        $(CONFIG.SELECTORS.MIN_ADD_WATER_INTERVAL).val(),

                        $(CONFIG.SELECTORS.SWITCH_2).is(':checked') ? 'true' : 'false'
                    );

                    const self = this;
                    $.get(url)
                        .done(function(response) {
                            const resJson = UTILS.parseJSON(response);
                            self.handleResponse(resJson, {
                                '0': '设置成功!',
                                '-1': '密码错误!'
                            });
                        })
                        .fail(function(error) {
                            UTILS.showMessage('错误', '请求失败', 'error');
                        })
                        .always(function() {
                            $btn.removeClass('loading').prop('disabled', false);

                    const self = this;
                    $.get(UTILS.formatString('{0}?devicepwd={1}', CONFIG.API.RESTART, $(CONFIG.SELECTORS.DEVICEPWD).val()))
                        .done(function(response) {
                            const resJson = UTILS.parseJSON(response);
                            self.handleResponse(resJson, {
                                '0': '设备将重启!',
                                '-1': '密码错误!'
                            });
                        })
                        .fail(function(error) {
                            UTILS.showMessage('错误', '请求失败', 'error');
                        })
                        .always(function() {
                            $btn.removeClass('loading').prop('disabled', false);
                        });
                },

                handleReset: function() {
                    const $btn = $(CONFIG.SELECTORS.BTN_RESET);
                    $btn.addClass('loading').prop('disabled', true);

                    const self = this;
                    $.get(UTILS.formatString('{0}?devicepwd={1}', CONFIG.API.RESET, $(CONFIG.SELECTORS.DEVICEPWD).val()))
                        .done(function(response) {
                            const resJson = UTILS.parseJSON(response);
                            self.handleResponse(resJson, {
                                '0': '设备将重置!',
                                '-1': '密码错误!'
                            });
                        })
                        .fail(function(error) {
                            UTILS.showMessage('错误', '请求失败', 'error');
                        })
                        .always(function() {
                            $btn.removeClass('loading').prop('disabled', false);
                        });
                },

                handleScanAP: function() {
                    const $btn = $(CONFIG.SELECTORS.BTN_SCANAP);
                    $btn.addClass('loading').prop('disabled', true);

                    const self = this;
                    $.get(CONFIG.API.SCAN_AP)
                        .done(function(response) {
                            const data = UTILS.parseJSON(response);
                            if (data && Object.keys(data).length > 0) {
                                self.showAPList(data);
                            } else {
                                UTILS.showMessage('提示', '未找到WiFi', 'warning');
                            }
                        })
                        .fail(function(error) {
                            UTILS.showMessage('错误', '扫描失败', 'error');
                        })
                        .always(function() {
                            $btn.removeClass('loading').prop('disabled', false);
                        });
                },

                handleConnect: function() {
                    const $btn = $(CONFIG.SELECTORS.BTN_CONNECT);
                    $btn.addClass('loading').prop('disabled', true);
                    this.refreshController.pause();

                    const url = UTILS.formatString(
                        '{0}?ssid={1}&pwd={2}&serverurl={3}&devicepwd={4}&devicename={5}&sw1name={6}&sw2name={7}',
                        CONFIG.API.SET_WIFI,
                        $(CONFIG.SELECTORS.SSID).val(),
                        $(CONFIG.SELECTORS.INPUT_PWD).val(),
                        $(CONFIG.SELECTORS.SERVERURL).val(),
                        $(CONFIG.SELECTORS.DEVICEPWD).val(),
                        $(CONFIG.SELECTORS.DEVICE_NAME_INPUT).val(),
                        $(CONFIG.SELECTORS.SWITCH_1_NAME_INPUT).val(),
                        $(CONFIG.SELECTORS.SWITCH_2_NAME_INPUT).val()
                    );

                    const self = this;
                    $.get(url)
                        .done(function(response) {
                            const resJson = UTILS.parseJSON(response);
                            self.handleResponse(resJson, {
                                '0': 'WiFi连接成功，设备将重启!',
                                '-1': '密码错误!'
                            });
                        })
                        .fail(function(error) {
                            UTILS.showMessage('错误', '请求失败', 'error');
                        })
                        .always(function() {
                            $btn.removeClass('loading').prop('disabled', false);
                            self.refreshController.resume();
                        });
                },

                handleResponse: function(resJson, messages) {
                    if (!resJson) {
                        UTILS.showMessage('错误', '无效的响应', 'error');
                        return;
                    }
                    const msg = messages[resJson.errCode] || (resJson.msg || '未知错误');
                    const type = resJson.errCode === '0' ? 'success' : 'error';
                    UTILS.showMessage(type === 'success' ? '成功' : '错误', msg, type);
                }
            };
        }

                    createSettingsView()
                ];

                // 创建图表管理器
                const chart = createChartManager('monitorChart').init();

                // 创建控制器
                const refreshCtrl = createRefreshController(deviceData, views, dataBuffer, chart);
                const eventCtrl = createEventController(refreshCtrl);

                // 绑定事件并启动
                eventCtrl.bindEvents();
                refreshCtrl.start();

                console.log('App initialized');
            }
        };

        // ============================================
        // 启动应用
        // ============================================
        $(document).ready(function() {
            App.init();
        });
    </script>
</body>

</html>
